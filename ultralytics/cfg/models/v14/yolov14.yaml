# YOLOv14 🚀, AGPL-3.0 license
# YOLOv14 full unified cross-domain detection model.
#
# Integrates ALL four innovations from the NeurIPS 2024 paper:
#   1. Deformable Area-Attention (D-AAttn)  — DeformableA2C2f blocks
#   2. Game2Real Domain Adaptation           — DomainAdaptiveLayer
#   3. Multi-View Conditioning               — ViewEmbedding
#   4. Adaptive Augmentation & Dynamic Routing — DynamicScaleRouter
#   + Panoramic modules                      — CircularConv / SphereAAttn
#
# Training objective:  L = L_det + 0.1·L_adv + 0.05·L_cross
#   (see v14DetectionLoss in ultralytics/utils/loss.py)

# Parameters
nc: 80 # number of classes
scales: # model compound scaling constants
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

# ── Backbone ──────────────────────────────────────────────
# Stage 1: scene analysis + entry conv
# Stage 2: multi-view conditioning (ViewEmbedding)
# Stage 3: Game2Real domain adaptation (DomainAdaptiveLayer)
# Stage 4-5: deformable feature pyramid (DeformableA2C2f)
backbone:
  # [from, repeats, module, args]
  - [-1, 1, CircularConv, [64, 3, 2]]               # 0-P1/2  wrap-aware conv
  - [-1, 1, Conv, [128, 3, 2, 1, 2]]                 # 1-P2/4
  - [-1, 1, ViewEmbedding, [128, 6, 64]]             # 2  Multi-View Conditioning
  - [-1, 1, DomainAdaptiveLayer, [128]]              # 3  Game2Real AdaIN
  - [-1, 2, C3k2, [256, False, 0.25]]                # 4
  - [-1, 1, Conv, [256, 3, 2, 1, 4]]                 # 5-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]                # 6
  - [-1, 1, DomainAdaptiveLayer, [512]]              # 7  Game2Real AdaIN
  - [-1, 1, Conv, [512, 3, 2]]                       # 8-P4/16
  - [-1, 4, DeformableA2C2f, [512, True, 4]]         # 9  D-AAttn
  - [-1, 1, Conv, [1024, 3, 2]]                      # 10-P5/32
  - [-1, 4, DeformableA2C2f, [1024, True, 1]]        # 11 D-AAttn

# ── Head ─────────────────────────────────────────────────
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 9], 1, Concat, [1]]                        # cat backbone P4
  - [-1, 2, DeformableA2C2f, [512, False, -1]]       # 14 D-AAttn

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]
  - [[-1, 6], 1, Concat, [1]]                        # cat backbone P3
  - [-1, 2, DeformableA2C2f, [256, False, -1]]       # 17 D-AAttn

  - [-1, 1, Conv, [256, 3, 2]]
  - [[-1, 14], 1, Concat, [1]]                       # cat head P4
  - [-1, 2, DeformableA2C2f, [512, False, -1]]       # 20 D-AAttn

  - [-1, 1, Conv, [512, 3, 2]]
  - [[-1, 11], 1, Concat, [1]]                       # cat head P5
  - [-1, 2, C3k2, [1024, True]]                      # 23 (P5/32-large)

  - [[17, 20, 23], 1, Detect, [nc]]                  # Detect(P3, P4, P5)
